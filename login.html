<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login | Kisan Connect</title>

    <link
        rel="stylesheet"
        href="css/login.css"
    >

</head>

<body>

    <div class="signup-container">

        <div class="signup-box">

            <!-- KISAN CONNECT LOGO -->
            <img
                src="images/logo.jpg"
                class="logo"
                alt="Kisan Connect Logo"
            >


            <h1>
                Welcome Back
            </h1>

            <p>
                Login to continue
            </p>


            <!-- LOGIN FORM -->
            <form id="loginForm">


                <!-- EMAIL -->
                <div class="input-group">

                    <label for="loginEmail">
                        Email
                    </label>

                    <input
                        type="email"
                        id="loginEmail"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <!-- PASSWORD -->
                <div class="input-group">

                    <label for="loginPassword">
                        Password
                    </label>

                    <input
                        type="password"
                        id="loginPassword"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <!-- LOGIN BUTTON -->
                <button
                    type="submit"
                    class="signup-btn"
                    id="loginBtn"
                >
                    Login
                </button>


            </form>


            <!-- SIGNUP LINK -->
            <p class="bottom-text">

                Don't have an account?

                <a href="signup.html">
                    Create One
                </a>

            </p>

        </div>

    </div>


    <!-- AUTHENTICATION SCRIPT -->
    <script src="js/login.js"></script>

</body>

</html>
