<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Product Details | Kisan Connect</title>


    <link
        rel="stylesheet"
        href="css/product-details.css"
    >

</head>


<body>


<!-- ==========================================
     HEADER
========================================== -->

<header class="product-header">

    <div class="product-logo">

        🌾 Kisan Connect

    </div>


    <div class="header-actions">

        <a
            href="marketplace.html"
            class="header-btn"
        >

            ← Marketplace

        </a>


        <button
            id="themeBtn"
            class="header-btn"
            type="button"
        >

            🌙

        </button>

    </div>

</header>



<!-- ==========================================
     MAIN PRODUCT AREA
========================================== -->

<main class="product-page">


    <!-- JavaScript loads product here -->

    <section id="productDetails">

    </section>



    <!-- ==========================================
         SELLER INFORMATION
    ========================================== -->

    <section class="seller-section">

        <h2>
            👤 Seller Information
        </h2>


        <div id="sellerInfo">

            <!-- JavaScript loads seller information here -->

        </div>

    </section>


</main>



<script
    src="js/product-details.js"
></script>


</body>

</html>
