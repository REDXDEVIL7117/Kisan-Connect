<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>My Orders | Kisan Connect</title>


    <!-- Orders Page CSS -->

    <link
        rel="stylesheet"
        href="css/orders.css"
    >

</head>


<body>


<!-- ==========================================
     HEADER
========================================== -->

<header class="orders-header">


    <!-- LOGO -->

    <div class="orders-logo">

        🌾 Kisan Connect

    </div>



    <!-- HEADER ACTIONS -->

    <div class="header-actions">


        <!-- MARKETPLACE -->

        <a
            href="marketplace.html"
            class="header-btn"
        >

            🛒 Marketplace

        </a>



        <!-- THEME BUTTON -->

        <button
            id="themeBtn"
            class="header-btn"
            type="button"
            aria-label="Toggle dark mode"
        >

            🌙

        </button>


    </div>


</header>



<!-- ==========================================
     MAIN PAGE
========================================== -->

<main class="orders-page">


    <!-- ======================================
         PAGE TITLE
    ======================================= -->

    <section class="orders-title">


        <h1>

            📋 My Orders

        </h1>


        <p>

            View your previous Kisan Connect
            orders and their details.

        </p>


    </section>



    <!-- ======================================
         ORDERS CONTAINER
    ======================================= -->

    <section
        id="ordersContainer"
        class="orders-container"
    >

        <!--

            JavaScript will load
            orders here.

        -->


    </section>


</main>



<!-- ==========================================
     JAVASCRIPT
========================================== -->

<script
    src="js/orders.js"
></script>


</body>

</html>
