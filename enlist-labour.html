<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Enlist Yourself | Kisan Connect</title>

    <link
        rel="stylesheet"
        href="css/dashboard.css"
    >

</head>


<body>


<!-- ==========================================
     HEADER
========================================== -->

<header>

    <h2>🌾 Kisan Connect</h2>

    <a href="labour-dashboard.html">

        <button id="logoutBtn" type="button">
            ← Dashboard
        </button>

    </a>

</header>



<!-- ==========================================
     WELCOME
========================================== -->

<section class="welcome">

    <h1>Enlist Yourself 👷</h1>

    <p>
        Create your labour profile so farmers
        and sellers can find you for work.
    </p>

</section>



<!-- ==========================================
     LABOUR PROFILE FORM
========================================== -->

<section class="dashboard-grid">

    <div class="card">

        <form id="labourForm">


            <!-- ==================================
                 FULL NAME
            ================================== -->

            <label for="labourName">
                Full Name
            </label>

            <br><br>

            <input
                type="text"
                id="labourName"
                placeholder="Enter your full name"
                required
            >

            <br><br>



            <!-- ==================================
                 PHONE NUMBER
                 Automatically comes from account
            ================================== -->

            <label for="labourPhone">
                Phone Number
            </label>

            <br><br>

            <input
                type="tel"
                id="labourPhone"
                inputmode="numeric"
                readonly
            >

            <br>

            <small>
                Your phone number comes from your account
                and cannot be changed here.
            </small>

            <br><br>



            <!-- ==================================
                 LOCATION
            ================================== -->

            <label for="labourLocation">
                Location
            </label>

            <br><br>

            <input
                type="text"
                id="labourLocation"
                placeholder="e.g. Bikaner"
                required
            >

            <br><br>



            <!-- ==================================
                 SKILLS
            ================================== -->

            <label>
                Skills
            </label>

            <br><br>


            <div>

                <!-- Harvesting -->

                <label>

                    <input
                        type="checkbox"
                        name="skill"
                        value="Harvesting"
                    >

                    🌾 Harvesting

                </label>

                <br><br>


                <!-- Ploughing -->

                <label>

                    <input
                        type="checkbox"
                        name="skill"
                        value="Ploughing"
                    >

                    🚜 Ploughing

                </label>

                <br><br>


                <!-- Irrigation -->

                <label>

                    <input
                        type="checkbox"
                        name="skill"
                        value="Irrigation"
                    >

                    💧 Irrigation

                </label>

                <br><br>


                <!-- Sowing -->

                <label>

                    <input
                        type="checkbox"
                        name="skill"
                        value="Sowing"
                    >

                    🌱 Sowing

                </label>

                <br><br>


                <!-- Weeding -->

                <label>

                    <input
                        type="checkbox"
                        name="skill"
                        value="Weeding"
                    >

                    🌿 Weeding

                </label>

                <br><br>


                <!-- Tractor Operation -->

                <label>

                    <input
                        type="checkbox"
                        name="skill"
                        value="Tractor Operation"
                    >

                    🚜 Tractor Operation

                </label>

            </div>

            <br>



            <!-- ==================================
                 EXPERIENCE
            ================================== -->

            <label for="experience">
                Experience
            </label>

            <br><br>

            <select
                id="experience"
                required
            >

                <option value="">
                    Select Experience
                </option>

                <option value="Beginner">
                    Beginner
                </option>

                <option value="1-2 Years">
                    1-2 Years
                </option>

                <option value="3-5 Years">
                    3-5 Years
                </option>

                <option value="5+ Years">
                    5+ Years
                </option>

            </select>

            <br><br>



            <!-- ==================================
                 EXPECTED PAY
            ================================== -->

            <label for="expectedPay">
                Expected Pay Per Day (₹)
            </label>

            <br><br>

            <input
                type="number"
                id="expectedPay"
                min="0"
                placeholder="e.g. 500"
                required
            >

            <br><br>



            <!-- ==================================
                 AVAILABILITY
            ================================== -->

            <label for="availability">
                Availability
            </label>

            <br><br>

            <select
                id="availability"
                required
            >

                <option value="">
                    Select Availability
                </option>

                <option value="Available">
                    🟢 Available
                </option>

                <option value="Busy">
                    🔴 Busy
                </option>

            </select>

            <br><br>



            <!-- ==================================
                 ABOUT
            ================================== -->

            <label for="aboutLabour">
                About You(including address)
            </label>

            <br><br>

            <textarea
                id="aboutLabour"
                rows="5"
                placeholder="Tell farmers and sellers about your work experience..."
            ></textarea>

            <br><br>



            <!-- ==================================
                 SAVE PROFILE
            ================================== -->

            <button
                type="submit"
                class="signup-btn"
            >

                Save Labour Profile

            </button>


        </form>

    </div>

</section>



<!-- ==========================================
     JAVASCRIPT
========================================== -->

<script src="js/labour.js"></script>


</body>

</html>
