<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Sign Up | Kisan Connect</title>

    <link
        rel="stylesheet"
        href="css/login.css"
    >

</head>

<body>

    <div class="signup-container">

        <div class="signup-box">

            <img
                src="images/logo.jpg"
                class="logo"
                alt="Kisan Connect Logo"
            >

            <h1>Create Your Account</h1>

            <p>
                Join India's Smart Agriculture Platform
            </p>

            <form id="signupForm">

                <!-- NAME -->
                <div class="input-group">

                    <label for="name">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        placeholder="Enter your name"
                        required
                    >

                </div>


                <!-- PHONE -->
                <div class="input-group">

                    <label for="phone">
                        Phone Number
                    </label>

                    <input
                        type="tel"
                        id="phone"
                        name="phone"
                        inputmode="numeric"
                        pattern="[0-9]{10}"
                        maxlength="10"
                        placeholder="Enter 10-digit phone number"
                        required
                    >

                </div>


                <!-- EMAIL -->
                <div class="input-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="example@email.com"
                        required
                    >

                </div>


                <!-- PASSWORD -->
                <div class="input-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Create password"
                        minlength="6"
                        required
                    >

                </div>


                <!-- CONFIRM PASSWORD -->
                <div class="input-group">

                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Confirm password"
                        minlength="6"
                        required
                    >

                </div>


                <!-- ROLE -->
                <div class="input-group">

                    <label for="role">
                        Select Your Role
                    </label>

                    <select id="role" required>

                        <option value="">
                            Choose One
                        </option>

                        <option value="Farmer">
                            👨‍🌾 Farmer
                        </option>

                        <option value="Labourer">
                            👷 Labourer
                        </option>

                        <option value="Seller">
                            🛒 Seller
                        </option>

                    </select>

                </div>


                <!-- SUBMIT -->
                <button
                    type="submit"
                    class="signup-btn"
                    id="signupBtn"
                >
                    Create Account
                </button>

            </form>


            <p class="bottom-text">

                Already have an account?

                <a href="login.html">
                    Login
                </a>

            </p>

        </div>

    </div>


    <script src="js/login.js"></script>

</body>

</html>
