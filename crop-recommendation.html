<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Crop Recommendation • Kisan Connect
    </title>

    <link
        rel="stylesheet"
        href="css/crop-recommendation.css"
    >

</head>

<body>

   <!-- ==========================================
     HEADER
========================================== -->

<header class="topbar">

    <a
        href="smart-farming-dashboard.html"
        class="back-btn">

        ← Back

    </a>

    <h1>

        🌱 Crop Recommendation

    </h1>

    <button
        id="themeBtn"
        class="theme-btn"
        type="button">

        🌙

    </button>

</header>


    <!-- ==========================================
         PAGE TITLE
    ========================================== -->

    <section class="hero">

        <h2>

            Find the Best Crop for Your Farm

        </h2>

        <p>

            Enter your farming details and receive
            personalized crop recommendations.

        </p>

    </section>


    <!-- ==========================================
         FORM
    ========================================== -->

    <main class="container">

        <form
            id="recommendationForm"
            class="recommendation-form"
        >

            <!-- State -->

            <div class="form-group">

                <label for="state">

                    State

                </label>

                <select
                    id="state"
                    required
                >

                    <option value="">
                        Select State
                    </option>

                    <option>Andhra Pradesh</option>
                    <option>Arunachal Pradesh</option>
                    <option>Assam</option>
                    <option>Bihar</option>
                    <option>Chhattisgarh</option>
                    <option>Goa</option>
                    <option>Gujarat</option>
                    <option>Haryana</option>
                    <option>Himachal Pradesh</option>
                    <option>Jharkhand</option>
                    <option>Karnataka</option>
                    <option>Kerala</option>
                    <option>Madhya Pradesh</option>
                    <option>Maharashtra</option>
                    <option>Manipur</option>
                    <option>Meghalaya</option>
                    <option>Mizoram</option>
                    <option>Nagaland</option>
                    <option>Odisha</option>
                    <option>Punjab</option>
                    <option>Rajasthan</option>
                    <option>Sikkim</option>
                    <option>Tamil Nadu</option>
                    <option>Telangana</option>
                    <option>Tripura</option>
                    <option>Uttar Pradesh</option>
                    <option>Uttarakhand</option>
                    <option>West Bengal</option>

                </select>

            </div>


            <!-- District -->

            <div class="form-group">

                <label for="district">

                    District

                </label>

                <input
                    type="text"
                    id="district"
                    placeholder="Enter your district"
                    required
                >

            </div>


            <!-- Soil -->

            <div class="form-group">

                <label for="soilType">

                    Soil Type

                </label>

                <select
                    id="soilType"
                    required
                >

                    <option value="">
                        Select Soil
                    </option>

                    <option>Alluvial</option>
                    <option>Black</option>
                    <option>Red</option>
                    <option>Laterite</option>
                    <option>Loamy</option>
                    <option>Sandy</option>
                    <option>Clay</option>
                    <option>Silty</option>

                </select>

            </div>


            <!-- Season -->

            <div class="form-group">

                <label for="season">

                    Season

                </label>

                <select
                    id="season"
                    required
                >

                    <option value="">
                        Select Season
                    </option>

                    <option>Kharif</option>
                    <option>Rabi</option>
                    <option>Zaid</option>

                </select>

            </div>


            <!-- Irrigation -->

            <div class="form-group">

                <label for="irrigation">

                    Irrigation

                </label>

                <select
                    id="irrigation"
                    required
                >

                    <option value="">
                        Select
                    </option>

                    <option>Yes</option>
                    <option>No</option>

                </select>

            </div>


            <!-- Farm Size -->

            <div class="form-group">

                <label for="farmSize">

                    Farm Size (Acres)

                </label>

                <input
                    type="number"
                    id="farmSize"
                    min="1"
                    placeholder="Optional"
                >

            </div>


            <button
                class="recommend-btn"
                type="submit"
            >

                🌾 Get Recommendations

            </button>

        </form>


        <!-- ==========================================
             RESULTS
        ========================================== -->

        <section
            id="resultsSection"
            class="results-section"
        >

            <div
                id="recommendationResults"
                class="recommendation-grid"
            >

                <div class="empty-results">

                    🌱

                    <h2>

                        No Recommendations Yet

                    </h2>

                    <p>

                        Fill in the form above and
                        press "Get Recommendations".

                    </p>

                </div>

            </div>

        </section>

    </main>


    <script src="js/crop-recommendation.js"></script>

</body>

</html>
